# Link-checker config. Internal relative links (incl. the committed PDFs) are checked normally.
# External hosts that bot-block or that we cite by number rather than assert as live are excluded.
accept = [200, 202, 206, 403, 429]
max_retries = 3
retry_wait_time = 2
timeout = 30
# Placeholder templates carry <PLACEHOLDER> link destinations, not real links — don't scan them.
exclude_path = ["STATUS.template.md"]
exclude = [
  "^https://eur-lex\\.europa\\.eu",                  # returns 202 to automated clients
  "^https://oeil\\.europarl\\.europa\\.eu",          # bot-sensitive
  "^https://wetgevingskalender\\.overheid\\.nl",     # blocks automated fetching (NL Iwt dossier)
  "^https://ieu-monitoring\\.com",                   # slow host; times out for CI
  "^https://zoek\\.officielebekendmakingen\\.nl",    # RSS watch-source (Kamervragen); not a live HTML link
  "^https://www\\.tweedekamer\\.nl",                 # bot-sensitive search URLs
  "^https://www\\.eerstekamer\\.nl",                 # slow host; times out for CI
  "^https://kpmg\\.com",                             # bot-blocks automated clients
  "^https://www\\.deloitte\\.com",                   # bot-blocks automated clients
  "^https://www\\.loyensloeff\\.com",                # bot-blocks automated clients
]
