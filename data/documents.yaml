# Document register — the SINGLE source of truth for every official document on the file(s).
# sources/README.md is its *rendered* table (edit this YAML, then mirror the table; never the table alone).
#
# POST-ADOPTION tracker: the three adopted acts are link-only (EUR-Lex). The committed PDFs are AMLA's
# Level-2/3 consultation papers + SPD (the live workstream) and reference NL documents.
#
# Field reference:
#   id            stable institutional id
#   title         quoted descriptive title
#   body          institution: Commission | Council | Parliament | AMLA | Netherlands | …
#   date          ISO YYYY-MM-DD
#   limite        bool
#   url / celex   authoritative URL(s)
#   local         committed file path
#   legal_basis   the AMLR/AMLD6/AMLAR article the instrument implements (Level-2/3 docs)
#   lead_source   credit for a Tier-2/3/external lead that surfaced the doc (name+handle, watchlist
#                 code, tip URL+date) — set when a register run was triggered by a tip, not a Tier-1 feed
#   notes         prose context (`>-` block)

